name: Setup Playwright

description: Download build artifact, restore permissions, cache and install browsers

inputs:
  build-configuration:
    description: Build configuration
    required: true
  target-framework:
    description: Target framework moniker
    required: true
  browser:
    description: Browser for this matrix job
    required: true

runs:
  using: composite

  steps:
    - name: Download build output
      uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
      with:
        name: playwright-build
        path: Testing/bin/${{ inputs.build-configuration }}/${{ inputs.target-framework }}

    - name: Restore Playwright executable permissions
      shell: bash
      run: |
        chmod +x Testing/bin/${{ inputs.build-configuration }}/${{ inputs.target-framework }}/.playwright/node/linux-x64/node

    - name: Cache Playwright browsers
      uses: actions/cache@v4 # v4.2.2
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('Testing/PlaywrightTests.csproj') }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ inputs.browser }}-

    - name: Install Playwright browsers
      shell: pwsh
      run: |
        ./Testing/bin/${{ inputs.build-configuration }}/${{ inputs.target-framework }}/playwright.ps1 install --with-deps ${{ inputs.browser }}