name: Build & Deploy (PRODUCTION)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Your GitHub Environment is named "prod"
    environment: prod

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ananyanand
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ghcr.io/ananyanand/gadag-app:latest \
            --push .

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}

          script: |
            set -e

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ananyanand --password-stdin

            docker pull ghcr.io/ananyanand/gadag-app:latest

            docker rm -f gadag_app || true

            docker run -d \
              --name gadag_app \
              --restart always \
              --network app_backend \
              -p 5000:80 \
              -e ASPNETCORE_ENVIRONMENT="Production" \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION }}" \
              -e Jwt__Key="${{ secrets.JWT_KEY }}" \
              -e SmsSettings__BaseUrl="${{ secrets.SMS_BASE_URL }}" \
              -e SmsSettings__ApiKey="${{ secrets.SMS_API }}" \
              -e SmsSettings__SenderId="${{ secrets.SMS_SENDER_ID }}" \
              -e SmsSettings__Channel="${{ secrets.CHANNEL }}" \
              -e SmsSettings__Route="${{ secrets.ROUTE }}" \
              -e SmsSettings__DLTTemplateId="${{ secrets.DLTTEMPLATEID }}" \
              -e SmsSettings__PEID="${{ secrets.PEID }}" \
              -e Easebuzz__Key="${{ secrets.EASEBUZZ_KEY }}" \
              -e Easebuzz__Salt="${{ secrets.EASEBUZZ_SALT }}" \
              -e Easebuzz__SubMerchantId="${{ secrets.EASEBUZZ_SUBMERCHANT }}" \
              -e Easebuzz__AccountCodes__MGRDPU="${{ secrets.MGRDPU }}" \
              -e Easebuzz__AccountCodes__INHAWKMGRDPU="${{ secrets.INHAWKMGRDPU }}" \
              -v /home/ubuntu/apps/gadag/Attachments:/app/Attachments \
              ghcr.io/ananyanand/gadag-app:latest

            # Allow uploads up to 5MB
            echo "client_max_body_size 5M;" | sudo tee /etc/nginx/conf.d/upload-size.conf

            sudo nginx -t
            sudo systemctl reload nginx

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Gadag PRODUCTION Deployment Failed"
          to: ${{ secrets.ALERT_EMAIL }}
          from: GitHub Actions
          body: |
            Gadag Production deployment failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Commit: ${{ github.sha }}

            Check workflow logs:
            https://github.com/${{ github.repository }}/actions