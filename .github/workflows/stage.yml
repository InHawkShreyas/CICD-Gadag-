name: Build & Deploy (STAGE)

on:
  push:
    branches:
      - stage-v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ghcr.io/react-inhawk/university-app:stage \
            --push .

      - name: Deploy to ACE Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u react-inhawk --password-stdin

            docker pull ghcr.io/react-inhawk/university-app:stage

            docker stop university_stage || true
            docker rm university_stage || true

            docker run -d \
              --name university_stage \
              --restart always \
              -p 5001:80 \
              ghcr.io/react-inhawk/university-app:stage